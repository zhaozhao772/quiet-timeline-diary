<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F3F8F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>我的记录 · 时间轴日记</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23DCEEE5'/%3E%3Cpath d='M7.5 16.5C7.5 10.5 11 7.5 17 7c.5 6.5-3 9.5-9.5 9.5z' fill='%2386B8A2'/%3E%3C/svg%3E">
<style>
/* ================= 基础与配色 ================= */
:root{
  --bg:        #F3F8F5;   /* 主背景 · 浅灰绿 */
  --green:     #86B8A2;   /* 主绿 */
  --green-soft:#DCEEE5;   /* 浅绿 */
  --green-deep:#5E9480;   /* 深绿（按钮/强调） */
  --green-ink: #3E6B5B;   /* 浅底上的绿字 */
  --blue:      #7FA8C4;   /* 主蓝（时间信息） */
  --blue-soft: #E1EEF5;   /* 浅蓝 */
  --blue-ink:  #4F7490;   /* 浅底上的蓝字 */
  --ink:       #3F5652;   /* 深色文字（非纯黑） */
  --ink-2:     #718581;   /* 次级文字 */
  --body-ink:  #4B625D;   /* 正文阅读色 */
  --danger:    #B87F72;   /* 柔和陶土色（删除） */
  --radius:    16px;
  --shadow:    0 6px 24px rgba(63,86,82,.07);
  --ease:      cubic-bezier(.33,.72,.28,1);
  --t:         320ms;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden; overscroll-behavior:none;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:var(--ink)}
::-webkit-scrollbar{width:0;height:0}

/* ================= 背景装饰（清晨 · 湖水 · 植物） ================= */
.bg-decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%}
.blob-a{width:74vmax;height:74vmax;left:-30vmax;top:-32vmax;
  background:radial-gradient(circle at center, rgba(134,184,162,.20), rgba(134,184,162,0) 62%)}
.blob-b{width:84vmax;height:84vmax;right:-36vmax;bottom:-38vmax;
  background:radial-gradient(circle at center, rgba(127,168,196,.17), rgba(127,168,196,0) 62%)}
.blob-c{width:44vmax;height:44vmax;left:-16vmax;bottom:-18vmax;
  background:radial-gradient(circle at center, rgba(127,168,196,.08), rgba(127,168,196,0) 60%)}
.leaf-decor{position:absolute;right:-52px;bottom:-34px;width:300px;opacity:.055;transform:rotate(-16deg)}
.leaf-decor2{position:absolute;left:-60px;top:22vh;width:190px;opacity:.04;transform:rotate(140deg)}

/* ================= 视图框架 ================= */
.view{position:fixed;inset:0;z-index:1;display:none;flex-direction:column}
.view.active{display:flex}
@keyframes vinR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes vinL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes vinU{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.vin-r{animation:vinR .3s var(--ease)}
.vin-l{animation:vinL .28s var(--ease)}
.vin-u{animation:vinU .3s var(--ease)}

/* 顶栏（玻璃感） */
.topbar{
  position:relative;z-index:6;flex:none;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(243,248,245,.86);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(111,142,133,.08);
}
.topbar-title{font-size:17px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.topbar-title svg{opacity:.8}
.topbar-spacer{flex:1}
.icon-btn{
  width:38px;height:38px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);transition:background .2s,transform .15s;
}
.icon-btn:active{background:var(--green-soft);transform:scale(.92)}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;z-index:2}

/* ================= 首页 · 文件夹 ================= */
.home-body{padding:18px 16px calc(36px + env(safe-area-inset-bottom))}
.folder-card{
  position:relative;overflow:hidden;
  display:flex;align-items:center;gap:14px;
  padding:18px 18px;border-radius:18px;
  background:linear-gradient(133deg,#E9F4EE 0%,#E4F0F0 55%,#E1EDF5 100%);
  box-shadow:var(--shadow);
}
.folder-card .leaf-mark{position:absolute;right:-14px;top:-16px;width:110px;opacity:.14;transform:rotate(24deg)}
.folder-icon{
  width:46px;height:46px;flex:none;border-radius:14px;
  background:rgba(255,255,255,.75);
  display:flex;align-items:center;justify-content:center;color:var(--green-deep);
  box-shadow:0 2px 8px rgba(63,86,82,.06);
}
.folder-name{font-size:16.5px;font-weight:700;letter-spacing:.3px}
.folder-sub{font-size:12.5px;color:var(--ink-2);margin-top:3px;letter-spacing:.3px}

/* 新建按钮（浅绿 · 轻盈） */
.btn-new{
  width:100%;margin-top:14px;height:48px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--green-soft);color:var(--green-ink);
  font-size:15px;font-weight:600;letter-spacing:1px;
  transition:background .2s,transform .15s;
  box-shadow:0 2px 10px rgba(134,184,162,.18);
}
.btn-new:active{background:#CFE7DB;transform:scale(.98)}

/* ================= 首页 · 时间轴 ================= */
.timeline{position:relative;margin-top:24px}
.timeline::before{
  content:"";position:absolute;left:10px;top:30px;bottom:34px;width:2px;border-radius:2px;
  background:linear-gradient(180deg,var(--green),var(--blue));opacity:.5;
}
.tl-item{display:flex;gap:12px;margin-bottom:14px;position:relative}
.tl-rail{width:22px;flex:none;position:relative}
.tl-dot{
  position:absolute;left:6px;top:25px;width:10px;height:10px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 0 4px rgba(134,184,162,.14), 0 0 12px rgba(134,184,162,.5);
}
.tl-card{
  flex:1;min-width:0;padding:15px 17px 14px;border-radius:var(--radius);
  background:linear-gradient(168deg,#FEFEFE 0%,#F5FAF7 75%,#F1F7F3 100%);
  box-shadow:var(--shadow);
  transition:transform .18s var(--ease),box-shadow .18s;
}
.tl-card:active{transform:scale(.985)}
.tl-meta{font-size:12px;color:var(--blue);font-weight:600;letter-spacing:.6px}
.tl-title{
  font-size:16px;font-weight:650;color:var(--ink);
  margin:5px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tl-preview{
  font-size:13.5px;color:var(--ink-2);line-height:1.75;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
@keyframes cardGlow{
  0%{box-shadow:0 0 0 0 rgba(134,184,162,0)}
  28%{box-shadow:0 0 0 7px rgba(134,184,162,.32),var(--shadow)}
  100%{box-shadow:var(--shadow)}
}
.tl-card.flash{animation:cardGlow 1.3s var(--ease)}

/* 空状态 */
.empty-state{padding:64px 30px 40px;text-align:center;color:var(--ink-2)}
.empty-state svg{opacity:.55;margin-bottom:16px}
.empty-title{font-size:15.5px;color:var(--ink);font-weight:600;letter-spacing:.5px}
.empty-sub{font-size:13px;margin-top:8px;line-height:2}
.empty-state .btn-new{width:auto;padding:0 26px;margin:22px auto 0}

/* ================= 详情 · 翻阅视图 ================= */
.detail-topbar{gap:6px}
.btn-back{
  display:flex;align-items:center;gap:3px;height:38px;padding:0 6px 0 2px;
  font-size:13.5px;color:var(--ink-2);font-weight:500;letter-spacing:.3px;
  border-radius:10px;flex:none;transition:transform .15s;
}
.btn-back:active{transform:scale(.94)}
.detail-meta{
  margin-left:auto;font-size:12.5px;color:var(--blue);
  font-weight:600;letter-spacing:.8px;white-space:nowrap;
}
.pager{flex:1;position:relative;overflow:hidden;touch-action:pan-y}
.slide{
  position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px 16px 30px;
}
.pager.anim .slide{transition:transform var(--t) var(--ease)}
.diary-card{
  background:linear-gradient(170deg,#FEFEFE 0%,#F6FAF8 70%,#F2F8F4 100%);
  border-radius:18px;padding:24px 22px 34px;
  box-shadow:var(--shadow);
  min-height:100%;
}
.diary-meta{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--blue);font-weight:600;letter-spacing:.6px}
.diary-title{font-size:21px;line-height:1.55;font-weight:700;color:var(--ink);margin:16px 0 20px;letter-spacing:.3px;word-break:break-word}
.diary-body{
  font-size:15.5px;line-height:2.15;color:var(--body-ink);
  white-space:pre-wrap;word-break:break-word;letter-spacing:.2px;
}
.diary-end{margin-top:30px;display:flex;justify-content:center;opacity:.5}
.diary-end i{width:5px;height:5px;border-radius:50%;background:var(--green);margin:0 5px}
.diary-end i:nth-child(2){background:var(--blue)}

/* 详情底部：编辑 ‹ 位置 › 删除 */
.detail-footer{
  flex:none;display:flex;align-items:center;
  padding:8px 14px calc(10px + env(safe-area-inset-bottom));
  background:rgba(243,248,245,.86);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid rgba(111,142,133,.08);
}
.mini-act{
  width:56px;height:48px;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:10.5px;color:var(--ink-2);letter-spacing:1px;
  transition:background .2s,transform .15s;
}
.mini-act:active{background:var(--green-soft);transform:scale(.93)}
.mini-act.warn:active{background:#F3E4E0}
.mini-act.warn{color:var(--danger)}
.pager-ctl{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.pg-btn{
  width:36px;height:36px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:var(--green-deep);background:var(--green-soft);
  transition:opacity .2s,transform .15s;
}
.pg-btn:active{transform:scale(.88)}
.pg-btn:disabled{opacity:.28;background:rgba(111,142,133,.1)}
.pg-pos{font-size:12px;color:var(--ink-2);letter-spacing:1.5px;min-width:58px;text-align:center;font-variant-numeric:tabular-nums}

/* ================= 编辑视图 ================= */
.edit-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 26px;display:flex;flex-direction:column}
.edit-date-row{
  display:flex;align-items:center;gap:10px;flex:none;
  background:var(--blue-soft);border-radius:14px;padding:11px 14px;color:var(--blue-ink);
}
#edit-date{
  flex:1;min-width:0;border:0;background:transparent;outline:none;
  font-size:13.5px;font-weight:600;letter-spacing:.5px;color:var(--blue-ink);
}
.edit-title{
  border:0;outline:none;background:transparent;width:100%;
  font-size:19.5px;font-weight:700;letter-spacing:.3px;color:var(--ink);
  padding:18px 4px 12px;
}
.edit-title::placeholder,.edit-content::placeholder{color:#A8BAB5;font-weight:400}
.edit-content{
  flex:1;min-height:180px;border:0;outline:none;background:transparent;width:100%;
  font-size:15.5px;line-height:2.1;color:var(--body-ink);
  padding:4px 4px 30px;resize:none;letter-spacing:.2px;
}
.edit-footer{
  flex:none;display:flex;gap:12px;align-items:center;
  padding:12px 18px calc(14px + env(safe-area-inset-bottom));
  background:rgba(243,248,245,.9);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid rgba(111,142,133,.08);
}
.btn{height:46px;border-radius:14px;font-size:15px;font-weight:600;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn-cancel{flex:1;background:rgba(111,142,133,.1);color:var(--ink-2)}
.btn-save{flex:1.35;background:var(--green-deep);color:#F6FBF8;box-shadow:0 4px 14px rgba(94,148,128,.3)}

/* ================= 设置视图 ================= */
.set-body{padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.set-card{
  background:linear-gradient(168deg,#FEFEFE,#F7FBF9);
  border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);
  margin-bottom:13px;
}
.set-head{display:flex;align-items:center;gap:11px}
.set-icon{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
.set-icon.g{background:var(--green-soft);color:var(--green-deep)}
.set-icon.b{background:var(--blue-soft);color:var(--blue-ink)}
.set-name{font-size:15px;font-weight:650;letter-spacing:.3px}
.set-desc{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.8}
.set-acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.act-btn{
  flex:1;min-width:130px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:13.5px;font-weight:600;letter-spacing:.3px;
  transition:transform .15s,background .2s;
}
.act-btn:active{transform:scale(.97)}
.act-btn.green{background:var(--green-soft);color:var(--green-ink)}
.act-btn.blue{background:var(--blue-soft);color:var(--blue-ink)}
.privacy-line{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:var(--ink-2);line-height:1.9;letter-spacing:.3px;
}
.set-stat{display:flex;align-items:baseline;gap:10px;margin:2px 0 2px}
.set-stat b{font-size:24px;font-weight:700;color:var(--green-deep);letter-spacing:.5px}
.set-stat span{font-size:12.5px;color:var(--ink-2);letter-spacing:.5px}

/* ================= 时间轴导航 Sheet ================= */
.overlay{
  position:fixed;inset:0;z-index:55;
  background:rgba(63,86,82,.26);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.overlay.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:rgba(253,254,253,.97);
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  border-radius:22px 22px 0 0;
  transform:translateY(105%);transition:transform .34s var(--ease);
  padding:8px 20px calc(18px + env(safe-area-inset-bottom));
  max-height:72dvh;display:flex;flex-direction:column;
  box-shadow:0 -10px 40px rgba(63,86,82,.1);
}
.sheet.open{transform:none}
.sheet-grab{width:38px;height:4px;border-radius:2px;background:rgba(111,142,133,.25);margin:4px auto 10px;flex:none}
.sheet-head{display:flex;align-items:center;gap:8px;flex:none;padding-bottom:10px;border-bottom:1px solid rgba(111,142,133,.09)}
.sheet-title{font-size:15px;font-weight:700;letter-spacing:1px;color:var(--ink)}
.sheet-close{margin-left:auto;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.sheet-close:active{background:var(--green-soft)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 2px 6px}
.tl-nav-year{
  font-size:13px;color:var(--blue-ink);font-weight:700;letter-spacing:2px;
  margin:14px 0 6px 4px;display:flex;align-items:center;gap:8px;
}
.tl-nav-year::before{content:"";width:14px;height:1.5px;background:var(--blue);opacity:.5;border-radius:2px}
.tl-nav-group{position:relative;padding-left:8px;margin-left:5px}
.tl-nav-group::before{
  content:"";position:absolute;left:8px;top:34px;bottom:14px;width:1.5px;
  background:linear-gradient(180deg,var(--green),var(--blue));opacity:.35;border-radius:2px;
}
.tl-nav-item{
  position:relative;display:flex;align-items:center;gap:10px;width:100%;
  padding:9px 10px 9px 6px;border-radius:11px;text-align:left;
  transition:background .2s;
}
.tl-nav-item:active{background:var(--green-soft)}
.tl-nav-item::before{
  content:"";width:7px;height:7px;border-radius:50%;background:var(--green);flex:none;
  box-shadow:0 0 0 3px rgba(134,184,162,.16),0 0 8px rgba(134,184,162,.45);
  margin-left:5px;
}
.tl-nav-date{font-size:13px;color:var(--blue-ink);font-weight:650;letter-spacing:.5px;flex:none;font-variant-numeric:tabular-nums}
.tl-nav-title{font-size:13.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-empty{padding:30px 0;text-align:center;font-size:13px;color:var(--ink-2)}

/* ================= 模态框 / Toast ================= */
.modal-mask{
  position:fixed;inset:0;z-index:70;
  background:rgba(63,86,82,.3);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:28px;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-mask.open{opacity:1;pointer-events:auto}
.modal{
  background:#FDFEFD;border-radius:18px;padding:24px 20px 16px;
  max-width:330px;width:100%;box-shadow:0 18px 50px rgba(63,86,82,.2);
  transform:translateY(12px) scale(.96);transition:transform .28s var(--ease);
}
.modal-mask.open .modal{transform:none}
.modal-title{font-size:16.5px;font-weight:700;letter-spacing:.5px;margin-bottom:10px}
.modal-body{font-size:13.5px;color:var(--ink-2);line-height:2;letter-spacing:.2px;white-space:pre-line}
.modal-acts{margin-top:20px;display:flex;flex-direction:column;gap:9px}
.modal-acts.row{flex-direction:row}
.mbtn{
  height:44px;border-radius:13px;font-size:14.5px;font-weight:600;letter-spacing:.8px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s;
}
.mbtn:active{transform:scale(.97)}
.mbtn-ghost{background:rgba(111,142,133,.1);color:var(--ink-2)}
.mbtn-main{background:var(--green-deep);color:#F6FBF8;box-shadow:0 4px 12px rgba(94,148,128,.28)}
.mbtn-danger{background:#F6E9E5;color:var(--danger)}
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));z-index:80;
  transform:translateX(-50%) translateY(10px);
  background:rgba(63,86,82,.92);color:#F3F8F5;
  font-size:13.5px;letter-spacing:.6px;line-height:1.6;
  padding:10px 20px;border-radius:99px;
  opacity:0;transition:opacity .3s,transform .3s;
  pointer-events:none;max-width:82vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<!-- 背景装饰 -->
<div class="bg-decor">
  <div class="blob blob-a"></div>
  <div class="blob blob-b"></div>
  <div class="blob blob-c"></div>
  <svg class="leaf-decor" viewBox="0 0 100 100" fill="none">
    <path d="M20 92C20 46 46 20 92 18c2 46-22 72-66 74z" stroke="#86B8A2" stroke-width="1.6"/>
    <path d="M22 90C40 60 60 40 88 22" stroke="#86B8A2" stroke-width="1.2"/>
    <path d="M40 74c8-2 16-8 22-16M30 80c4-6 10-12 16-16" stroke="#86B8A2" stroke-width="1"/>
  </svg>
  <svg class="leaf-decor2" viewBox="0 0 100 100" fill="none">
    <path d="M20 92C20 46 46 20 92 18c2 46-22 72-66 74z" stroke="#7FA8C4" stroke-width="1.6"/>
    <path d="M22 90C40 60 60 40 88 22" stroke="#7FA8C4" stroke-width="1.2"/>
  </svg>
</div>

<!-- ============ 首页：文件夹 + 时间轴 ============ -->
<section id="view-home" class="view">
  <header class="topbar">
    <div class="topbar-title">

<script>
"use strict";
/* =========================================================
   工具函数
========================================================= */
const $ = s => document.querySelector(s);
const p2 = n => String(n).padStart(2,"0");
const WEEK = ["日","一","二","三","四","五","六"];
function fmtDate(ts){ const d=new Date(ts); return `${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())}`; }
function fmtMD(ts){ const d=new Date(ts); return `${p2(d.getMonth()+1)}.${p2(d.getDate())}`; }
function fmtTime(ts){ const d=new Date(ts); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function fmtWeek(ts){ return "周" + WEEK[new Date(ts).getDay()]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function tsToInput(ts){ const d=new Date(ts); return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function inputToTs(v){ const t = Date.parse(v); return isNaN(t) ? null : t; }
function sortRecs(list){ return list.slice().sort((a,b)=> (b.date-a.date) || (b.createdAt-a.createdAt)); }
function previewOf(c){ const t=String(c||"").replace(/\s+/g," ").trim(); return t.length>64 ? t.slice(0,64)+"…" : t; }
function downloadFile(name, content, type){
  const blob = new Blob([content], {type: type + ";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
}

/* =========================================================
   本地存储：IndexedDB 为主 + localStorage 镜像兜底
   （数据永远只在本机，不做任何网络请求）
========================================================= */
const IDB_NAME = "quiet-timeline-diary";
const IDB_STORE = "records";
const MIRROR_KEY = "qtd-mirror-v1";
const INIT_FLAG = "qtd-inited-v1";
const TIP_FLAG  = "qtd-tip-v1";
let idb = null;

function openIDB(){
  return new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error("no idb")); return; }
    let req;
    try{ req = indexedDB.open(IDB_NAME, 1); }
    catch(e){ reject(e); return; }
    req.onupgradeneeded = ()=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:"id"});
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
    req.onblocked = ()=> reject(new Error("blocked"));
    setTimeout(()=> reject(new Error("timeout")), 2500);
  });
}
function idbAll(){
  return new Promise((resolve)=>{
    try{
      const tx = idb.transaction(IDB_STORE, "readonly");
      const rq = tx.objectStore(IDB_STORE).getAll();
      rq.onsuccess = ()=> resolve(rq.result || []);
      rq.onerror = ()=> resolve(null);
    }catch(e){ resolve(null); }
  });
}
function idbPut(rec){ try{ idb.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).put(rec); }catch(e){} }
function idbDelete(id){ try{ idb.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).delete(id); }catch(e){} }
function idbClear(){ return new Promise(r=>{ try{
  const tx = idb.transaction(IDB_STORE,"readwrite");
  tx.objectStore(IDB_STORE).clear(); tx.oncomplete = r; tx.onerror = r;
}catch(e){ r(); } }); }
function writeMirror(list){ try{ localStorage.setItem(MIRROR_KEY, JSON.stringify(list)); }catch(e){} }
function readMirror(){ try{ const s = localStorage.getItem(MIRROR_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }

/* =========================================================
   应用状态
========================================================= */
const state = {
  records: [],          // 按 date 降序
  view: "home",
  detailIndex: 0,
  editingId: null,
  editorFrom: "home",
  homeScroll: 0,
};
const R = ()=> state.records;

/* =========================================================
   首次使用 · 欢迎记录
========================================================= */
function welcomeRecords(){
  const now = Date.now();
  const t1 = now - 2*60*1000;
  const t2 = now - 3*24*60*60*1000 - 37*60*1000;
  return [
    { id:newId(), title:"欢迎来到我的记录",
      content:"这是一个只属于你的安静空间。\n\n所有记录都只保存在这台手机上，不上传，不同步，也不需要网络。\n\n打开一篇记录后，可以用手指左右滑动，慢慢翻阅前后的日子。\n\n这篇欢迎记录，可以随时删除。",
      date:t1, createdAt:t1, updatedAt:t1 },
    { id:newId(), title:"今天去了很远的地方",
      content:"有时候记录下来以后，才发现自己其实已经走了很远。\n\n慢慢写，慢慢翻。时间会在这里安静地生长。",
      date:t2, createdAt:t2, updatedAt:t2 },
  ];
}

/* =========================================================
   视图切换
========================================================= */
const VIEWS = ["home","detail","edit","settings"];
function showView(name, anim){
  state.view = name;
  VIEWS.forEach(v=> $("#view-"+v).classList.remove("active","vin-r","vin-l","vin-u"));
  const el = $("#view-"+name);
  el.classList.add("active");
  if(anim){ void el.offsetWidth; el.classList.add(anim); }
}

/* =========================================================
   首页渲染
========================================================= */
function renderHome(){
  const list = R();
  $("#folder-sub").textContent = list.length
    ? `${list.length} 篇记录 · ${fmtMD(list[list.length-1].date)} — ${fmtMD(list[0].date)}`
    : "一个安静的记录空间";
  const tl = $("#timeline");
  tl.innerHTML = list.map((r,i)=>`
    <div class="tl-item" data-id="${esc(r.id)}">
      <div class="tl-rail"><span class="tl-dot"></span></div>
      <article class="tl-card" data-id="${esc(r.id)}">
        <div class="tl-meta">${fmtDate(r.date)} · ${fmtWeek(r.date)}　${fmtTime(r.date)}</div>
        <h2 class="tl-title">${esc(r.title || "未命名记录")}</h2>
        <p class="tl-preview">${esc(previewOf(r.content))}</p>
      </article>
    </div>`).join("");
  $("#empty-state").hidden = list.length > 0;
  tl.style.display = list.length ? "" : "none";
  renderSettings();
}
function showHome(keepScroll){
  renderHome();
  showView("home", "vin-l");
  const sc = $("#home-scroll");
  requestAnimationFrame(()=>{ sc.scrollTop = keepScroll ? state.homeScroll : 0; });
}
function locateRecord(id){
  const item = document.querySelector(`.tl-item[data-id="${id}"]`);
  if(!item) return;
  item.scrollIntoView({behavior:"smooth", block:"center"});
  const card = item.querySelector(".tl-card");
  card.classList.add("flash");
  setTimeout(()=> card.classList.remove("flash"), 1400);
}

/* =========================================================
   详情 · 时间轴翻阅
========================================================= */
const pagerEl = $("#pager");
const sPrev = $("#slide-prev"), sCur = $("#slide-cur"), sNext = $("#slide-next");
let animating = false;
let drag = null;

function slideHTML(r){
  if(!r) return "";
  return `
  <article class="diary-card">
    <div class="diary-meta">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="15" rx="2.5"/><path d="M8 3.5v4M16 3.5v4M4 10.5h16"/></svg>
      ${fmtDate(r.date)} · ${fmtWeek(r.date)}　${fmtTime(r.date)}
    </div>
    <h1 class="diary-title">${esc(r.title || "未命名记录")}</h1>
    <div class="diary-body">${esc(r.content)}</div>
    <div class="diary-end"><i></i><i></i></div>
  </article>`;
}
function setTrack(dx){
  sPrev.style.transform = `translateX(calc(-100% + ${dx}px))`;
  sCur.style.transform  = `translateX(${dx}px)`;
  sNext.style.transform = `translateX(calc(100% + ${dx}px))`;
}
function renderPager(){
  const i = state.detailIndex, list = R();
  sPrev.innerHTML = slideHTML(list[i-1]);
  sCur.innerHTML  = slideHTML(list[i]);
  sNext.innerHTML = slideHTML(list[i+1]);
  [sPrev,sCur,sNext].forEach(s=> s.scrollTop = 0);
  setTrack(0);
}
function updateDetailHeader(){
  const list = R(), i = state.detailIndex, r = list[i];
  $("#detail-meta").textContent = r ? `${fmtDate(r.date)} · ${fmtTime(r.date)}` : "";
  $("#pg-pos").textContent = `${i+1} / ${list.length}`;
  $("#pg-prev").disabled = i <= 0;
  $("#pg-next").disabled = i >= list.length - 1;
}
function openDetail(i){
  if(i<0 || i>=R().length) return;
  state.detailIndex = i;
  renderPager(); updateDetailHeader();
  showView("detail","vin-r");
  if(!localStorage.getItem(TIP_FLAG)){
    localStorage.setItem(TIP_FLAG,"1");
    setTimeout(()=> toast("左右滑动，可以翻阅前后记录"), 650);
  }
}
function springBack(){
  pagerEl.classList.add("anim");
  setTrack(0);
  let done = false;
  const fin = ()=>{ if(done) return; done = true; pagerEl.classList.remove("anim"); };
  pagerEl.addEventListener("transitionend", fin, {once:true});
  setTimeout(fin, 420);
}
function go(dir){
  if(animating) return;
  const target = state.detailIndex + dir;
  const list = R();
  if(target < 0 || target >= list.length){ springBack(); return; }
  animating = true;
  pagerEl.classList.add("anim");
  setTrack(-dir * pagerEl.clientWidth);   /* dir=1：翻下一篇，轨道左移 */
  state.detailIndex = target;
  updateDetailHeader();
  let done = false;
  const fin = ()=>{
    if(done) return; done = true;
    pagerEl.classList.remove("anim");
    renderPager();
    animating = false;
  };
  pagerEl.addEventListener("transitionend", fin, {once:true});
  setTimeout(fin, 460);
}
const hasPrev = ()=> state.detailIndex > 0;
const hasNext = ()=> state.detailIndex < R().length - 1;

/* ---- 触摸手势（水平翻页 / 垂直交给滚动） ---- */
function startDrag(x, y){
  if(animating || state.view !== "detail") return;
  drag = {x0:x, y0:y, dx:0, locked:null, t0:Date.now()};
}
function moveDrag(x, y){
  if(!drag) return;
  const dx = x - drag.x0, dy = y - drag.y0;
  if(drag.locked === null){
    if(Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
    drag.locked = Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  }
  if(drag.locked !== "x") return;
  drag.dx = dx;
  let d = dx;
  if((dx < 0 && !hasNext()) || (dx > 0 && !hasPrev())) d = dx * 0.32;  /* 边界阻尼 */
  setTrack(d);
}
function endDrag(){
  if(!drag) return;
  const {dx, locked} = drag;
  drag = null;
  if(locked !== "x") return;
  const W = pagerEl.clientWidth;
  const th = Math.min(90, W * 0.22);
  if(dx <= -th) go(1);
  else if(dx >= th) go(-1);
  else springBack();
}
pagerEl.addEventListener("touchstart", e=>{ if(e.touches.length===1) startDrag(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
pagerEl.addEventListener("touchmove", e=>{
  if(!drag || e.touches.length!==1) return;
  moveDrag(e.touches[0].clientX, e.touches[0].clientY);
  if(drag && drag.locked === "x") e.preventDefault();
}, {passive:false});
pagerEl.addEventListener("touchend", endDrag, {passive:true});
pagerEl.addEventListener("touchcancel", endDrag, {passive:true});
/* ---- 桌面：鼠标拖拽 ---- */
pagerEl.addEventListener("mousedown", e=>{ if(e.button===0){ startDrag(e.clientX, e.clientY); e.preventDefault(); } });
window.addEventListener("mousemove", e=>{ if(drag) moveDrag(e.clientX, e.clientY); });
window.addEventListener("mouseup", endDrag);
/* ---- 桌面：键盘 ---- */
document.addEventListener("keydown", e=>{
  if(state.view !== "detail") return;
  if(e.key === "ArrowRight") go(1);
  else if(e.key === "ArrowLeft") go(-1);
  else if(e.key === "Escape") showHome(true);
});

/* =========================================================
   编辑：新建 / 修改
========================================================= */
function openEditor(id, from){
  state.editingId = id || null;
  state.editorFrom = from || "home";
  const r = id ? R().find(x=>x.id===id) : null;
  $("#edit-date").value = tsToInput(r ? r.date : Date.now());
  $("#edit-title").value = r ? (r.title||"") : "";
  $("#edit-content").value = r ? (r.content||"") : "";
  $("#edit-title-label").textContent = r ? "编辑记录" : "新建记录";
  showView("edit","vin-u");
}
async function saveEditor(){
  const title = $("#edit-title").value.trim();
  const content = $("#edit-content").value;
  if(!title && !content.trim()){ toast("写一点什么，再保存吧"); return; }
  const date = inputToTs($("#edit-date").value) || Date.now();
  const now = Date.now();
  let savedId;
  if(state.editingId){
    const r = R().find(x=>x.id===state.editingId);
    if(r){ r.title=title; r.content=content; r.date=date; r.updatedAt=now; savedId=r.id; idbPut(r); }
  }else{
    const rec = {id:newId(), title, content, date, createdAt:now, updatedAt:now};
    savedId = rec.id;
    state.records.push(rec);
    idbPut(rec);
  }
  state.records = sortRecs(state.records);
  writeMirror(state.records);
  toast("已保存");
  if(state.editorFrom === "detail" && savedId){
    renderHome();
    openDetail(R().findIndex(x=>x.id===savedId));
  }else{
    showHome(false);
    setTimeout(()=> locateRecord(savedId), 350);
  }
}
function askDelete(id){
  const r = R().find(x=>x.id===id);
  if(!r) return;
  showModal({
    title: "删除这一篇？",
    body: "删除后无法恢复，\n这篇记录会从时间里消失。",
    buttons: [
      {text:"再想想", cls:"mbtn-ghost"},
      {text:"删除", cls:"mbtn-danger", onClick: async ()=>{
        state.records = R().filter(x=>x.id!==id);
        idbDelete(id);
        writeMirror(state.records);
        renderHome();
        toast("已删除");
        showHome(true);
      }},
    ],
  });
}

/* =========================================================
   设置页：统计 / 导出 / 导入
========================================================= */
function renderSettings(){
  const list = R();
  $("#stat-count").textContent = list.length;
  $("#stat-span").textContent = list.length
    ? `${fmtDate(list[list.length-1].date)} — ${fmtDate(list[0].date)}` : "";
}
function exportJSON(){
  const list = R();
  if(!list.length){ toast("还没有记录可以导出"); return; }
  const data = {
    app: "quiet-timeline-diary",
    version: 1,
    exportedAt: new Date().toISOString(),
    records: list.slice().reverse().map(r=>({id:r.id, title:r.title||"", content:r.content||"", date:r.date, createdAt:r.createdAt, updatedAt:r.updatedAt})),
  };
  downloadFile(`我的记录-备份-${fmtDate(Date.now())}.json`, JSON.stringify(data, null, 2), "application/json");
  toast("已导出 JSON 备份");
}
function exportMD(){
  const list = R();
  if(!list.length){ toast("还没有记录可以导出"); return; }
  const parts = [
    "# 我的记录\n",
    `> 共 ${list.length} 篇 · 导出于 ${fmtDate(Date.now())} ${fmtTime(Date.now())}\n`,
  ];
  list.slice().reverse().forEach(r=>{
    parts.push(`---\n\n## ${fmtDate(r.date)} ${fmtWeek(r.date)} · ${fmtTime(r.date)}`);
    parts.push(r.title ? `\n### ${r.title||"未命名记录"}\n` : "\n");
    parts.push(`${r.content||""}\n`);
  });
  downloadFile(`我的记录-${fmtDate(Date.now())}.md`, parts.join(""), "text/markdown");
  toast("已导出 Markdown");
}
function normalizeImported(raw){
  const list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.records) ? raw.records : null);
  if(!list) return null;
  const out = [];
  for(const it of list){
    if(!it || typeof it !== "object") continue;
    let d = Number(it.date);
    if(!isFinite(d) || d <= 0){
      const alt = Number(it.createdAt);
      d = (isFinite(alt) && alt > 0) ? alt : Date.now();
    }
    out.push({
      id: String(it.id || newId()),
      title: String(it.title || ""),
      content: String(it.content || ""),
      date: d,
      createdAt: Number(it.createdAt) || d,
      updatedAt: Number(it.updatedAt) || d,
    });
  }
  return out;
}
function handleImport(raw){
  const backup = normalizeImported(raw);
  if(!backup || !backup.length){ toast("这个文件里没有可用的记录"); return; }
  const local = R();
  const keyOf = r => `${r.date}|${r.title}|${r.content}`;
  const localKeys = new Set(local.map(keyOf));
  const localIds = new Set(local.map(r=>r.id));
  const same = backup.filter(r=>localKeys.has(keyOf(r))).length;
  const fresh = backup.length - same;
  showModal({
    title: "导入备份",
    body: `备份中共 ${backup.length} 篇记录，\n其中 ${same} 篇与当前记录相同，${fresh} 篇是新的。\n\n合并导入：把新记录加入现有记录；\n覆盖当前数据：清空现有 ${local.length} 篇，换成备份内容。`,
    buttons: [
      {text:"合并导入（推荐）", cls:"mbtn-main", onClick: async ()=>{
        let added = 0;
        for(const r of backup){
          if(localKeys.has(keyOf(r))) continue;
          const rec = {...r};
          if(localIds.has(rec.id)) rec.id = newId();
          state.records.push(rec);
          idbPut(rec);
          localIds.add(rec.id);
          added++;
        }
        state.records = sortRecs(state.records);
        writeMirror(state.records);
        renderHome();
        toast(added ? `已合并导入 ${added} 篇记录` : "备份中的记录都已存在");
      }},
      {text:"覆盖当前数据", cls:"mbtn-danger", onClick: ()=>{
        showModal({
          title: "确定覆盖？",
          body: `覆盖会删除当前的 ${local.length} 篇记录，\n替换为备份中的 ${backup.length} 篇。`,
          buttons: [
            {text:"再想想", cls:"mbtn-ghost"},
            {text:"确定覆盖", cls:"mbtn-danger", onClick: async ()=>{
              await idbClear();
              state.records = sortRecs(backup);
              state.records.forEach(idbPut);
              writeMirror(state.records);
              renderHome();
              toast(`已恢复 ${state.records.length} 篇记录`);
            }},
          ],
        });
      }},
      {text:"取消", cls:"mbtn-ghost"},
    ],
  });
}
$("#import-file").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{ handleImport(JSON.parse(reader.result)); }
    catch(err){ toast("无法读取这个备份文件"); }
  };
  reader.onerror = ()=> toast("无法读取这个备份文件");
  reader.readAsText(f, "utf-8");
  e.target.value = "";
});

/* =========================================================
   时间轴导航 Sheet
========================================================= */
function renderTlNav(){
  const groups = {};
  for(const r of R()){
    const y = new Date(r.date).getFullYear();
    (groups[y] = groups[y] || []).push(r);
  }
  const years = Object.keys(groups).sort((a,b)=> b-a);
  const body = $("#sheet-body");
  if(!years.length){
    body.innerHTML = `<div class="sheet-empty">时间轴还没有内容</div>`;
    return;
  }
  body.innerHTML = years.map(y=>`
    <div class="tl-nav-group">
      <div class="tl-nav-year">${y}</div>
      ${groups[y].map(r=>`
        <button class="tl-nav-item" data-id="${esc(r.id)}">
          <span class="tl-nav-date">${fmtMD(r.date)}</span>
          <span class="tl-nav-title">${esc(r.title || "未命名记录")}</span>
        </button>`).join("")}
    </div>`).join("");
}
function openSheet(){
  renderTlNav();
  $("#overlay").classList.add("open");
  $("#sheet-tlnav").classList.add("open");
}
function closeSheet(){
  $("#overlay").classList.remove("open");
  $("#sheet-tlnav").classList.remove("open");
}

/* =========================================================
   模态框 / Toast
========================================================= */
let toastTimer = null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2000);
}
function showModal(opt){
  $("#modal-title").textContent = opt.title || "";
  $("#modal-body").textContent = opt.body || "";
  const acts = $("#modal-acts");
  acts.innerHTML = "";
  (opt.buttons || []).forEach(b=>{
    const el = document.createElement("button");
    el.className = "mbtn " + (b.cls || "mbtn-ghost");
    el.textContent = b.text;
    el.addEventListener("click", ()=>{
      closeModal();
      if(b.onClick) b.onClick();
    });
    acts.appendChild(el);
  });
  $("#modal-mask").classList.add("open");
}
function closeModal(){ $("#modal-mask").classList.remove("open"); }
$("#modal-mask").addEventListener("click", e=>{ if(e.target === e.currentTarget) closeModal(); });

/* =========================================================
   事件绑定
========================================================= */
$("#btn-new").addEventListener("click", ()=> openEditor(null, "home"));
$("#btn-new-empty").addEventListener("click", ()=> openEditor(null, "home"));
$("#timeline").addEventListener("click", e=>{
  const item = e.target.closest(".tl-item");
  if(!item) return;
  const i = R().findIndex(r=>r.id === item.dataset.id);
  if(i >= 0){ state.homeScroll = $("#home-scroll").scrollTop; openDetail(i); }
});
$("#btn-back").addEventListener("click", ()=> showHome(true));
$("#pg-prev").addEventListener("click", ()=> go(-1));
$("#pg-next").addEventListener("click", ()=> go(1));
$("#btn-edit").addEventListener("click", ()=>{
  const r = R()[state.detailIndex];
  if(r) openEditor(r.id, "detail");
});
$("#btn-del").addEventListener("click", ()=>{
  const r = R()[state.detailIndex];
  if(r) askDelete(r.id);
});
$("#edit-back").addEventListener("click", ()=>{
  const t = $("#edit-title").value, c = $("#edit-content").value;
  if(t.trim() || c.trim()){
    showModal({ title:"放弃这篇？", body:"还没有保存，离开后这次修改会消失。",
      buttons:[
        {text:"继续编辑", cls:"mbtn-ghost"},
        {text:"放弃", cls:"mbtn-danger", onClick: ()=>{
          if(state.editorFrom === "detail"){ renderPager(); showView("detail","vin-l"); }
          else showHome(true);
        }},
      ]});
  }else{
    if(state.editorFrom === "detail"){ renderPager(); showView("detail","vin-l"); }
    else showHome(true);
  }
});
$("#edit-cancel").addEventListener("click", ()=> $("#edit-back").click());
$("#edit-save").addEventListener("click", saveEditor);
$("#btn-settings").addEventListener("click", ()=>{ renderSettings(); showView("settings","vin-r"); });
$("#settings-back").addEventListener("click", ()=> showHome(true));
$("#btn-export-json").addEventListener("click", exportJSON);
$("#btn-export-md").addEventListener("click", exportMD);
$("#btn-import").addEventListener("click", ()=> $("#import-file").click());
$("#btn-tlnav").addEventListener("click", openSheet);
$("#sheet-close").addEventListener("click", closeSheet);
$("#overlay").addEventListener("click", closeSheet);
$("#sheet-body").addEventListener("click", e=>{
  const item = e.target.closest(".tl-nav-item");
  if(!item) return;
  closeSheet();
  setTimeout(()=> locateRecord(item.dataset.id), 220);
});

/* =========================================================
   初始化
========================================================= */
(async function init(){
  try{ idb = await openIDB(); }catch(e){ idb = null; }
  let recs = null;
  if(idb) recs = await idbAll();
  if(!recs || !recs.length){
    /* IndexedDB 不可用或为空时，尝试从 localStorage 镜像恢复 */
    const mirror = readMirror();
    if(mirror && mirror.length){
      recs = mirror;
      if(idb) recs.forEach(idbPut);
    }else if(!localStorage.getItem(INIT_FLAG)){
      recs = welcomeRecords();
      if(idb) recs.forEach(idbPut);
      try{ localStorage.setItem(INIT_FLAG, "1"); }catch(e){}
    }
  }
  state.records = sortRecs(recs || []);
  writeMirror(state.records);
  renderHome();
  showView("home", "vin-u");
})();
</script>
