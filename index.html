<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#F3F8F5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>我的记录</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='11' fill='%23DCEEE5'/%3E%3Cpath d='M7.5 16.5C7.5 10.5 11 7.5 17 7c.5 6.5-3 9.5-9.5 9.5z' fill='%2386B8A2'/%3E%3C/svg%3E">
<style>
/* ================= 基础与配色 ================= */
:root{
  --bg:        #F3F8F5;   /* 主背景 · 浅灰绿 */
  --green:     #86B8A2;   /* 主绿 */
  --green-soft:#DCEEE5;   /* 浅绿 */
  --green-deep:#5E9480;   /* 深绿（按钮/强调） */
  --green-ink: #3E6B5B;   /* 浅底上的绿字 */
  --blue:      #7FA8C4;   /* 主蓝（时间信息） */
  --blue-soft: #E1EEF5;   /* 浅蓝 */
  --blue-ink:  #4F7490;   /* 浅底上的蓝字 */
  --ink:       #3F5652;   /* 深色文字（非纯黑） */
  --ink-2:     #718581;   /* 次级文字 */
  --body-ink:  #4B625D;   /* 正文阅读色 */
  --stamp-ink: #5E7A72;   /* 追加标记文字 */
  --danger:    #B87F72;   /* 柔和陶土色（删除） */
  --radius:    16px;
  --shadow:    0 6px 24px rgba(63,86,82,.07);
  --ease:      cubic-bezier(.33,.72,.28,1);
  --t:         320ms;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","MiSans","Source Han Sans SC","Noto Sans CJK SC","Microsoft YaHei","Segoe UI",Roboto,sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.7;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow:hidden; overscroll-behavior:none;
  touch-action:manipulation;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
input,textarea{font:inherit;color:var(--ink)}
::-webkit-scrollbar{width:0;height:0}

/* ================= 背景装饰（清晨 · 湖水 · 植物） ================= */
.bg-decor{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%}
.blob-a{width:74vmax;height:74vmax;left:-30vmax;top:-32vmax;
  background:radial-gradient(circle at center, rgba(134,184,162,.20), rgba(134,184,162,0) 62%)}
.blob-b{width:84vmax;height:84vmax;right:-36vmax;bottom:-38vmax;
  background:radial-gradient(circle at center, rgba(127,168,196,.17), rgba(127,168,196,0) 62%)}
.blob-c{width:44vmax;height:44vmax;left:-16vmax;bottom:-18vmax;
  background:radial-gradient(circle at center, rgba(127,168,196,.08), rgba(127,168,196,0) 60%)}
.leaf-decor{position:absolute;right:-52px;bottom:-34px;width:300px;opacity:.055;transform:rotate(-16deg)}
.leaf-decor2{position:absolute;left:-60px;top:22vh;width:190px;opacity:.04;transform:rotate(140deg)}

/* ================= 视图框架 ================= */
.view{position:fixed;inset:0;z-index:1;display:none;flex-direction:column}
.view.active{display:flex}
@keyframes vinR{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
@keyframes vinL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes vinU{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.vin-r{animation:vinR .3s var(--ease)}
.vin-l{animation:vinL .28s var(--ease)}
.vin-u{animation:vinU .3s var(--ease)}

/* 顶栏（玻璃感） */
.topbar{
  position:relative;z-index:6;flex:none;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(243,248,245,.86);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(111,142,133,.08);
}
.topbar-title{font-size:17px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px;color:var(--ink)}
.topbar-title svg{opacity:.8}
.topbar-spacer{flex:1}
/* 首页顶栏：图标在标题上方（触发左侧文件夹抽屉） */
.topbar-home{align-items:flex-start}
.home-brand{display:flex;flex-direction:column;align-items:flex-start;gap:5px;padding-top:2px}
.brand-icon-btn{
  width:46px;height:46px;border-radius:14px;flex:none;padding:3px;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,transform .15s;
}
.brand-icon-btn img{
  width:100%;height:100%;object-fit:contain;display:block;
  pointer-events:none;-webkit-user-drag:none;user-select:none;
}
.brand-icon-btn:active{background:var(--green-soft);transform:scale(.92)}
@media (max-width:360px){ .brand-icon-btn{width:40px;height:40px} }
.icon-btn{
  width:38px;height:38px;border-radius:12px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);transition:background .2s,transform .15s;
}
.icon-btn:active{background:var(--green-soft);transform:scale(.92)}
.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative;z-index:2}

/* ================= 首页 · 记录列表（横向卡片相册式） ================= */
.home-body{padding:18px 16px calc(36px + env(safe-area-inset-bottom))}
.section-title{
  display:flex;align-items:center;gap:10px;
  font-size:22px;font-weight:700;letter-spacing:.8px;color:var(--ink);
  margin:8px 0 16px;
}
.section-title .folder-icon-small{
  width:40px;height:40px;border-radius:12px;
  background:linear-gradient(135deg,var(--green-soft),var(--blue-soft));
  display:flex;align-items:center;justify-content:center;color:var(--green-deep);
  box-shadow:0 2px 8px rgba(63,86,82,.06);
}

/* 分类/统计卡 */
.category-card{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(168deg,#FEFEFE,#F7FBF9);
  border-radius:var(--radius);padding:14px 16px;
  box-shadow:var(--shadow);margin-bottom:16px;
}
.cat-item{
  flex:1;display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:12px;
  background:var(--green-soft);color:var(--green-ink);
  transition:transform .15s;
}
.cat-item:active{transform:scale(.98)}
.cat-icon{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.6);display:flex;align-items:center;justify-content:center}
.cat-text{flex:1}
.cat-name{font-size:14px;font-weight:650;letter-spacing:.5px}
.cat-count{font-size:12px;opacity:.85;margin-top:2px}

/* 新建按钮 */
.btn-new{
  width:100%;height:48px;border-radius:15px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--green-soft);color:var(--green-ink);
  font-size:15px;font-weight:600;letter-spacing:1px;
  transition:background .2s,transform .15s;
  box-shadow:0 2px 10px rgba(134,184,162,.18);
  margin-bottom:16px;
}
.btn-new:active{background:#CFE7DB;transform:scale(.98)}

/* 横向卡片列表 */
.note-list{
  position:relative;
  display:flex;
  overflow-x:auto;
  overflow-y:hidden;
  scroll-snap-type:x mandatory;
  scroll-behavior:smooth;
  -webkit-overflow-scrolling:touch;
  padding:4px 0 8px;
  scrollbar-width:none;
}
.note-list::-webkit-scrollbar{display:none}
.note-item{
  flex:none;
  width:calc(100% - 48px);
  margin-right:12px;
  scroll-snap-align:center;
  position:relative;
}
.note-item:first-child{margin-left:16px}
.note-item:last-child{margin-right:16px}
.note-card{
  width:100%;height:100%;min-height:380px;padding:18px 18px 16px;border-radius:var(--radius);
  background:linear-gradient(168deg,#FEFEFE 0%,#F5FAF7 75%,#F1F7F3 100%);
  box-shadow:var(--shadow);
  transition:transform .18s var(--ease),box-shadow .18s;
  display:flex;flex-direction:column;
}
.note-card:active{transform:scale(.985)}
.note-created{
  font-size:12px;color:var(--blue);font-weight:600;letter-spacing:.6px;
  display:flex;align-items:center;gap:6px;
}
.note-card-header{
  display:flex;align-items:center;gap:8px;margin:10px 0 6px;
}
.note-title{
  flex:1;font-size:17px;font-weight:650;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.btn-rename{
  width:30px;height:30px;border-radius:9px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);transition:background .2s,transform .15s;
}
.btn-rename:active{background:var(--green-soft);transform:scale(.9)}
.note-preview{
  flex:1;font-size:14px;color:var(--ink-2);line-height:1.85;
  display:-webkit-box;-webkit-line-clamp:10;-webkit-box-orient:vertical;overflow:hidden;
}
.carousel-dots{
  display:flex;justify-content:center;align-items:center;gap:8px;
  margin:6px 0 12px;
}
.carousel-dots:empty{display:none}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(111,142,133,.25);
  transition:background .2s,transform .2s;
}
.dot.active{background:var(--green);transform:scale(1.25)}
@keyframes cardGlow{
  0%{box-shadow:0 0 0 0 rgba(134,184,162,0)}
  28%{box-shadow:0 0 0 7px rgba(134,184,162,.32),var(--shadow)}
  100%{box-shadow:var(--shadow)}
}
.note-card.flash{animation:cardGlow 1.3s var(--ease)}

/* 空状态 */
.empty-state{padding:64px 30px 40px;text-align:center;color:var(--ink-2)}
.empty-state svg{opacity:.55;margin-bottom:16px}
.empty-title{font-size:15.5px;color:var(--ink);font-weight:600;letter-spacing:.5px}
.empty-sub{font-size:13px;margin-top:8px;line-height:2}
.empty-state .btn-new{width:auto;padding:0 26px;margin:22px auto 0}

/* ================= 详情 · 只读历史展示 ================= */
.detail-topbar{gap:6px}
.btn-back{
  display:flex;align-items:center;gap:3px;height:38px;padding:0 6px 0 2px;
  font-size:13.5px;color:var(--ink-2);font-weight:500;letter-spacing:.3px;
  border-radius:10px;flex:none;transition:transform .15s;
}
.btn-back:active{transform:scale(.94)}
.detail-actions-top{display:flex;align-items:center;gap:6px;margin-left:auto}
.detail-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 30px}
.detail-card{
  background:linear-gradient(170deg,#FEFEFE 0%,#F6FAF8 70%,#F2F8F4 100%);
  border-radius:18px;padding:22px 20px 28px;
  box-shadow:var(--shadow);
  min-height:calc(100% - 20px);
}
.detail-created{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;color:var(--blue);font-weight:600;letter-spacing:.6px;
  background:var(--blue-soft);padding:7px 12px;border-radius:99px;
}
.detail-title{font-size:21px;line-height:1.55;font-weight:700;color:var(--ink);margin:16px 0 18px;letter-spacing:.3px;word-break:break-word}
.detail-content{
  font-size:15.5px;line-height:2.15;color:var(--body-ink);
  white-space:pre-wrap;word-break:break-word;letter-spacing:.2px;
}
.detail-content .stamp-line{
  color:var(--stamp-ink);font-weight:600;letter-spacing:.3px;
}
.detail-end{margin-top:30px;display:flex;justify-content:center;opacity:.5}
.detail-end i{width:5px;height:5px;border-radius:50%;background:var(--green);margin:0 5px}
.detail-end i:nth-child(2){background:var(--blue)}

.detail-footer{
  flex:none;display:flex;align-items:center;justify-content:center;gap:14px;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  background:rgba(243,248,245,.86);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid rgba(111,142,133,.08);
}
.btn-edit-main{
  height:46px;border-radius:14px;padding:0 26px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  background:var(--green-deep);color:#F6FBF8;font-size:15px;font-weight:600;letter-spacing:1px;
  box-shadow:0 4px 14px rgba(94,148,128,.3);transition:transform .15s;
}
.btn-edit-main:active{transform:scale(.97)}

/* ================= 编辑视图 ================= */
.edit-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 26px;display:flex;flex-direction:column;gap:12px}
.edit-meta-card{
  flex:none;background:var(--blue-soft);border-radius:14px;padding:12px 14px;color:var(--blue-ink);
}
.edit-meta-row{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;letter-spacing:.3px}
.edit-meta-row + .edit-meta-row{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(79,116,144,.18)}
.edit-meta-label{opacity:.85}
.edit-meta-value{flex:1;text-align:right}
.edit-title{
  border:0;outline:none;background:transparent;width:100%;
  font-size:19.5px;font-weight:700;letter-spacing:.3px;color:var(--ink);
  padding:8px 4px 4px;
}
.edit-title::placeholder{color:#A8BAB5;font-weight:400}
.edit-history-box{
  flex:none;background:linear-gradient(168deg,#FEFEFE,#F7FBF9);border-radius:14px;padding:14px 16px;
  box-shadow:var(--shadow);max-height:180px;overflow-y:auto;
}
.edit-history-label{
  font-size:12px;color:var(--blue-ink);font-weight:600;letter-spacing:.8px;margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.edit-history{
  font-size:13.5px;line-height:1.95;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;
}
.edit-new-area{
  flex:1;display:flex;flex-direction:column;min-height:140px;
  background:linear-gradient(168deg,#FEFEFE,#F7FBF9);border-radius:14px;padding:14px 16px;
  box-shadow:var(--shadow);
}
.edit-new-label{
  font-size:12px;color:var(--green-ink);font-weight:600;letter-spacing:.8px;margin-bottom:8px;
  display:flex;align-items:center;gap:6px;
}
.edit-content{
  flex:1;min-height:100px;border:0;outline:none;background:transparent;width:100%;
  font-size:15.5px;line-height:2.1;color:var(--body-ink);
  resize:none;letter-spacing:.2px;
}
.edit-content::placeholder{color:#A8BAB5;font-weight:400}
.edit-footer{
  flex:none;display:flex;gap:12px;align-items:center;
  padding:12px 18px calc(14px + env(safe-area-inset-bottom));
  background:rgba(243,248,245,.9);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid rgba(111,142,133,.08);
}
.btn{height:46px;border-radius:14px;font-size:15px;font-weight:600;letter-spacing:1px;display:flex;align-items:center;justify-content:center;gap:6px;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn-cancel{flex:1;background:rgba(111,142,133,.1);color:var(--ink-2)}
.btn-save{flex:1.35;background:var(--green-deep);color:#F6FBF8;box-shadow:0 4px 14px rgba(94,148,128,.3)}

/* ================= 设置视图 ================= */
.set-body{padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.set-card{
  background:linear-gradient(168deg,#FEFEFE,#F7FBF9);
  border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow);
  margin-bottom:13px;
}
.set-head{display:flex;align-items:center;gap:11px}
.set-icon{width:38px;height:38px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center}
.set-icon.g{background:var(--green-soft);color:var(--green-deep)}
.set-icon.b{background:var(--blue-soft);color:var(--blue-ink)}
.set-name{font-size:15px;font-weight:650;letter-spacing:.3px}
.set-desc{font-size:12.5px;color:var(--ink-2);margin-top:3px;line-height:1.8}
.set-acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.act-btn{
  flex:1;min-width:130px;height:42px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:13.5px;font-weight:600;letter-spacing:.3px;
  transition:transform .15s,background .2s;
}
.act-btn:active{transform:scale(.97)}
.act-btn.green{background:var(--green-soft);color:var(--green-ink)}
.act-btn.blue{background:var(--blue-soft);color:var(--blue-ink)}
.privacy-line{
  display:flex;align-items:center;gap:10px;
  font-size:13px;color:var(--ink-2);line-height:1.9;letter-spacing:.3px;
}
.set-stat{display:flex;align-items:baseline;gap:10px;margin:2px 0 2px}
.set-stat b{font-size:24px;font-weight:700;color:var(--green-deep);letter-spacing:.5px}
.set-stat span{font-size:12.5px;color:var(--ink-2);letter-spacing:.5px}

/* ================= 侧边栏：我的文件夹 ================= */
.sidebar-mask{
  position:fixed;inset:0;z-index:49;
  background:rgba(63,86,82,.25);
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.sidebar-mask.open{opacity:1;pointer-events:auto}
.sidebar{
  position:fixed;left:0;top:0;bottom:0;z-index:50;
  width:min(78vw, 320px);max-width:320px;
  background:linear-gradient(180deg,#F7FAF8 0%,#F3F8F5 100%);
  box-shadow:6px 0 32px rgba(63,86,82,.14);
  display:flex;flex-direction:column;
  transform:translateX(-100%);transition:transform .32s var(--ease);
}
.sidebar.open{transform:translateX(0)}
.sidebar-header{
  flex:none;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  background:rgba(243,248,245,.92);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(111,142,133,.08);
}
.sidebar-title{
  flex:1;font-size:16px;font-weight:700;letter-spacing:.6px;color:var(--ink);
  display:flex;align-items:center;gap:8px;
}
.sidebar-title svg{opacity:.8}
.sidebar-close{
  width:36px;height:36px;border-radius:11px;flex:none;
  display:flex;align-items:center;justify-content:center;
  color:var(--ink-2);transition:background .2s,transform .15s;
}
.sidebar-close:active{background:var(--green-soft);transform:scale(.92)}
.sidebar-scroll{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 14px calc(24px + env(safe-area-inset-bottom));
}
.sidebar-list{display:flex;flex-direction:column;gap:10px}
.sidebar-item{
  display:flex;align-items:center;gap:10px;
  background:linear-gradient(168deg,#FEFEFE,#F7FBF9);
  border-radius:14px;padding:13px 12px 13px 14px;
  box-shadow:0 2px 10px rgba(63,86,82,.05);
  transition:transform .15s,background .2s;
}
.sidebar-item:active{background:var(--green-soft);transform:scale(.985)}
.sidebar-item-main{
  flex:1;min-width:0;
  display:flex;flex-direction:column;gap:3px;
}
.sidebar-item-title{
  font-size:14.5px;font-weight:650;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.sidebar-item-meta{
  font-size:11.5px;color:var(--ink-2);letter-spacing:.3px;
}
.sidebar-empty{
  text-align:center;color:var(--ink-2);padding:40px 16px;
  font-size:13.5px;line-height:1.9;
}

/* ================= 模态框 / Toast ================= */
.modal-mask{
  position:fixed;inset:0;z-index:70;
  background:rgba(63,86,82,.3);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;padding:28px;
  opacity:0;pointer-events:none;transition:opacity .25s;
}
.modal-mask.open{opacity:1;pointer-events:auto}
.modal{
  background:#FDFEFD;border-radius:18px;padding:24px 20px 16px;
  max-width:330px;width:100%;box-shadow:0 18px 50px rgba(63,86,82,.2);
  transform:translateY(12px) scale(.96);transition:transform .28s var(--ease);
}
.modal-mask.open .modal{transform:none}
.modal-title{font-size:16.5px;font-weight:700;letter-spacing:.5px;margin-bottom:10px}
.modal-body{font-size:13.5px;color:var(--ink-2);line-height:2;letter-spacing:.2px;white-space:pre-line}
.modal-acts{margin-top:20px;display:flex;flex-direction:column;gap:9px}
.mbtn{
  height:44px;border-radius:13px;font-size:14.5px;font-weight:600;letter-spacing:.8px;
  display:flex;align-items:center;justify-content:center;transition:transform .15s;
}
.mbtn:active{transform:scale(.97)}

<script>
"use strict";
/* =========================================================
   工具函数
========================================================= */
const $ = s => document.querySelector(s);
const p2 = n => String(n).padStart(2,"0");
const WEEK = ["日","一","二","三","四","五","六"];
function fmtCNDate(ts){ const d=new Date(ts); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`; }
function fmtDate(ts){ const d=new Date(ts); return `${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())}`; }
function fmtMD(ts){ const d=new Date(ts); return `${p2(d.getMonth()+1)}.${p2(d.getDate())}`; }
function fmtTime(ts){ const d=new Date(ts); return `${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function fmtCNDateTime(ts){ const d=new Date(ts); return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${p2(d.getHours())}:${p2(d.getMinutes())}`; }
function fmtWeek(ts){ return "周" + WEEK[new Date(ts).getDay()]; }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function sortRecs(list){ return list.slice().sort((a,b)=> a.createdAt - b.createdAt); } /* 从旧到新 */
function previewOf(c){ const t=String(c||"").replace(/\s+/g," ").trim(); return t.length>64 ? t.slice(0,64)+"…" : t; }
function downloadFile(name, content, type){
  const blob = new Blob([content], {type: type + ";charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 1000);
}

/* 追加格式：严格按用户要求 */
function appendStamp(text, ts){
  return `\n\n【${fmtCNDateTime(ts)}】\n（自动记录日期时间）\n${text}`;
}

/* =========================================================
   本地存储：IndexedDB 为主 + localStorage 镜像兜底
========================================================= */
const IDB_NAME = "quiet-timeline-diary";
const IDB_STORE = "records";
const MIRROR_KEY = "qtd-mirror-v2"; /* v2：追加式记录模型 */
const INIT_FLAG = "qtd-inited-v2";
let idb = null;

function openIDB(){
  return new Promise((resolve, reject)=>{
    if(!window.indexedDB){ reject(new Error("no idb")); return; }
    let req;
    try{ req = indexedDB.open(IDB_NAME, 2); }
    catch(e){ reject(e); return; }
    req.onupgradeneeded = (event)=>{
      const db = req.result;
      if(!db.objectStoreNames.contains(IDB_STORE)) db.createObjectStore(IDB_STORE, {keyPath:"id"});
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
    req.onblocked = ()=> reject(new Error("blocked"));
    setTimeout(()=> reject(new Error("timeout")), 2500);
  });
}
function idbAll(){
  return new Promise((resolve)=>{
    try{
      const tx = idb.transaction(IDB_STORE, "readonly");
      const rq = tx.objectStore(IDB_STORE).getAll();
      rq.onsuccess = ()=> resolve(rq.result || []);
      rq.onerror = ()=> resolve(null);
    }catch(e){ resolve(null); }
  });
}
function idbPut(rec){ try{ idb.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).put(rec); }catch(e){} }
function idbDelete(id){ try{ idb.transaction(IDB_STORE,"readwrite").objectStore(IDB_STORE).delete(id); }catch(e){} }
function idbClear(){ return new Promise(r=>{ try{
  const tx = idb.transaction(IDB_STORE,"readwrite");
  tx.objectStore(IDB_STORE).clear(); tx.oncomplete = r; tx.onerror = r;
}catch(e){ r(); } }); }
function writeMirror(list){ try{ localStorage.setItem(MIRROR_KEY, JSON.stringify(list)); }catch(e){} }
function readMirror(){ try{ const s = localStorage.getItem(MIRROR_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }

/* =========================================================
   应用状态
========================================================= */
const state = {
  records: [],          // 按 createdAt 升序（从旧到新）
  view: "home",
  detailId: null,
  editingId: null,
};
const R = ()=> state.records;

/* =========================================================
   数据兼容：保留已有记录，首次创建时间不可变
========================================================= */
function normalizeRecord(r){
  if(!r || typeof r !== "object") return null;
  const created = Number(r.createdAt) || Number(r.date) || Date.now();
  return {
    id: String(r.id || newId()),
    title: String(r.title || ""),
    content: String(r.content || ""),
    createdAt: created,
    date: created,          // date 固定等于首次创建时间，不再变化
  };
}
function upgradeData(list){
  return list.map(normalizeRecord).filter(Boolean);
}

/* =========================================================
   首次使用 · 欢迎记录（用追加模型）
========================================================= */
function welcomeRecords(){
  const now = Date.now();
  const t2 = now - 3*24*60*60*1000 - 37*60*1000;
  return [
    { id:newId(), title:"欢迎来到我的记录",
      content:"这是一个只属于你的安静空间。\n\n所有记录都只保存在这台手机上，不上传，不同步，也不需要网络。\n\n点击一篇记录可以查看完整内容；点击\"继续记录\"可以在原有内容之后追加新的文字。\n\n这篇欢迎记录，可以随时删除。",
      createdAt:t2, date:t2 },
    { id:newId(), title:"今天开始使用这个工具",
      content:"这是你的第二篇记录。\n\n每次编辑时，原来的内容都会保留，新的文字会按时间顺序追加在后面。",
      createdAt:now, date:now },
  ];
}

/* =========================================================
   视图切换
========================================================= */
const VIEWS = ["home","detail","edit","settings"];
function showView(name, anim){
  state.view = name;
  VIEWS.forEach(v=> $("#view-"+v).classList.remove("active","vin-r","vin-l","vin-u"));
  const el = $("#view-"+name);
  el.classList.add("active");
  if(anim){ void el.offsetWidth; el.classList.add(anim); }
}

/* =========================================================
   首页渲染：记录列表（从旧到新）
========================================================= */
function renderHome(){
  const list = R();
  $("#cat-count").textContent = `${list.length} 篇记录`;
  const nl = $("#note-list");
  const dots = $("#carousel-dots");
  nl.innerHTML = list.map((r,i)=>`
    <div class="note-item" data-id="${esc(r.id)}" data-index="${i}">
      <article class="note-card" data-id="${esc(r.id)}">
        <div class="note-created">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5.5" width="16" height="15" rx="2.5"/><path d="M8 3.5v4M16 3.5v4M4 10.5h16"/></svg>
          ${fmtCNDate(r.createdAt)} · ${fmtWeek(r.createdAt)}　${fmtTime(r.createdAt)}
        </div>
        <div class="note-card-header">
          <h2 class="note-title">${esc(r.title || "未命名记录")}</h2>
          <button class="btn-rename" data-id="${esc(r.id)}" data-action="rename" aria-label="修改名称">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.05 2.05 0 013 0 2.05 2.05 0 010 3L8 19l-4 1z"/></svg>
          </button>
        </div>
        <p class="note-preview">${esc(previewOf(r.content))}</p>
      </article>
    </div>`).join("");
  dots.innerHTML = list.map((_,i)=>`<span class="dot ${i===0?"active":""}" data-index="${i}"></span>`).join("");
  $("#empty-state").hidden = list.length > 0;
  nl.style.display = list.length ? "" : "none";
  renderSettings();
  updateCarouselDots();
  renderSidebar();
}
function renderSidebar(){
  const list = R();
  const container = $("#sidebar-list");
  if(!container) return;
  if(!list.length){
    container.innerHTML = `<div class="sidebar-empty">还没有文件<br>先写下第一篇记录吧</div>`;
    return;
  }
  container.innerHTML = list.map(r=>`
    <div class="sidebar-item" data-id="${esc(r.id)}">
      <div class="sidebar-item-main">
        <div class="sidebar-item-title">${esc(r.title || "未命名记录")}</div>
        <div class="sidebar-item-meta">${fmtCNDate(r.createdAt)} · ${fmtWeek(r.createdAt)}</div>
      </div>
      <button class="btn-rename" data-id="${esc(r.id)}" data-action="rename" aria-label="修改名称">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2.05 2.05 0 013 0 2.05 2.05 0 010 3L8 19l-4 1z"/></svg>
      </button>
    </div>`).join("");
}
function openSidebar(){
  $("#sidebar-mask").classList.add("open");
  $("#sidebar").classList.add("open");
  renderSidebar();
}
function closeSidebar(){
  $("#sidebar-mask").classList.remove("open");
  $("#sidebar").classList.remove("open");
}
function updateCarouselDots(){
  const nl = $("#note-list");
  if(!nl || !nl.children.length) return;
  const n = nl.children.length;
  const page = nl.scrollWidth / n;
  const idx = Math.min(n-1, Math.max(0, Math.round(nl.scrollLeft / page)));
  document.querySelectorAll(".dot").forEach((d,i)=> d.classList.toggle("active", i===idx));
}
function scrollToCard(index){
  const nl = $("#note-list");
  const item = nl.children[index];
  if(!item) return;
  const target = item.offsetLeft - (nl.clientWidth - item.offsetWidth) / 2;
  nl.scrollTo({left: target, behavior:"smooth"});
}
function showHome(keepScroll){
  renderHome();
  showView("home", keepScroll ? undefined : "vin-l");
  if(keepScroll){
    const sc = $("#home-scroll");
    requestAnimationFrame(()=>{ sc.scrollTop = state.homeScroll || 0; });
  }
}
function locateRecord(id){
  const idx = R().findIndex(r=>r.id===id);
  if(idx < 0) return;
  setTimeout(()=> scrollToCard(idx), 100);
  const item = document.querySelector(`.note-item[data-id="${id}"]`);
  if(item){
    const card = item.querySelector(".note-card");
    card.classList.add("flash");
    setTimeout(()=> card.classList.remove("flash"), 1400);
  }
}
function renameRecord(id){
  const r = R().find(x=>x.id===id);
  if(!r) return;
  showModal({
    title: "修改文件名称",
    body: "",
    buttons: [
      {text:"取消", cls:"mbtn-ghost"},
      {text:"保存", cls:"mbtn-main", onClick: ()=>{
        const input = $("#rename-input");
        if(input){
          r.title = input.value.trim();
          idbPut(r);
          writeMirror(state.records);
          renderHome();
          renderSidebar();
          toast("已修改名称");
        }
      }},
    ],
  });
  /* 把输入框塞进 modal body */
  const body = $("#modal-body");
  body.innerHTML = `<input id="rename-input" type="text" maxlength="60" value="${esc(r.title)}" placeholder="输入新名称" style="width:100%;padding:12px 14px;border:0;border-radius:12px;background:var(--green-soft);font-size:15px;color:var(--ink);outline:none;">`;
  requestAnimationFrame(()=>{ const inp=$("#rename-input"); if(inp) inp.focus(); });
}

/* =========================================================
   详情页：只读历史展示
========================================================= */
function openDetail(id){
  const r = R().find(x=>x.id===id);
  if(!r) return;
  state.detailId = id;
  $("#detail-created-text").textContent = `${fmtCNDate(r.createdAt)} · ${fmtWeek(r.createdAt)}　${fmtTime(r.createdAt)}`;
  $("#detail-title").textContent = r.title || "未命名记录";
  $("#detail-content").textContent = r.content;
  showView("detail","vin-r");
}

/* =========================================================
   编辑页：新建 / 追加
========================================================= */
function openEditor(id){
  state.editingId = id || null;
  const r = id ? R().find(x=>x.id===id) : null;
  $("#edit-title-label").textContent = r ? "继续记录" : "新建记录";
  $("#edit-created").textContent = r ? fmtCNDateTime(r.createdAt) : fmtCNDateTime(Date.now());
  $("#edit-title").value = r ? (r.title||"") : "";

  if(r){
    /* 编辑已有：显示只读历史 + 新增输入框 */
    $("#edit-history-box").hidden = false;
    $("#edit-history").textContent = r.content;
    $("#edit-content").value = "";
    $("#edit-new-label-text").textContent = "本次新增内容";
    $("#edit-content").placeholder = "在这里写下这次要追加的内容……";
  }else{
    /* 新建：隐藏历史区，正文输入即首篇内容 */
    $("#edit-history-box").hidden = true;
    $("#edit-history").textContent = "";
    $("#edit-content").value = "";
    $("#edit-new-label-text").textContent = "在这里写下第一篇……";
    $("#edit-content").placeholder = "写下你的第一篇记录……";
  }
  showView("edit","vin-u");
}

function saveEditor(){
  const title = $("#edit-title").value.trim();
  const added = $("#edit-content").value;
  if(!title && !added.trim()){ toast("写一点什么，再保存吧"); return; }

  const now = Date.now();
  if(state.editingId){
    /* 追加式保存 */
    const r = R().find(x=>x.id===state.editingId);
    if(!r) return;
    if(!added.trim()){ toast("本次还没有新增内容"); return; }
    r.title = title;  /* 标题可直接修改，不属于历史正文 */
    r.content = r.content + appendStamp(added, now);
    idbPut(r);
    toast("已追加保存");
  }else{
    /* 新建 */
    if(!added.trim()){ toast("写一点什么，再保存吧"); return; }
    const rec = {id:newId(), title, content:added, createdAt:now, date:now};
    state.records.push(rec);
    idbPut(rec);
    toast("已保存");
  }
  state.records = sortRecs(state.records);
  writeMirror(state.records);
  renderSidebar();
  showHome(false);
  if(state.editingId){
    setTimeout(()=> locateRecord(state.editingId), 350);
    state.editingId = null;
  }else{
    const newest = R()[R().length-1];
    if(newest) setTimeout(()=> locateRecord(newest.id), 350);
  }
}

function askDelete(id){
  const r = R().find(x=>x.id===id);
  if(!r) return;
  showModal({
    title: "删除这一篇？",
    body: "删除后无法恢复，\n这篇记录会从列表里消失。",
    buttons: [
      {text:"再想想", cls:"mbtn-ghost"},
      {text:"删除", cls:"mbtn-danger", onClick: async ()=>{
        state.records = R().filter(x=>x.id!==id);
        idbDelete(id);
        writeMirror(state.records);
        renderHome();
        renderSidebar();
        toast("已删除");
        showHome(true);
      }},
    ],
  });
}

/* =========================================================
   设置页：统计 / 导出 / 导入
========================================================= */
function renderSettings(){
  const list = R();
  $("#stat-count").textContent = list.length;
  $("#stat-span").textContent = list.length
    ? `${fmtDate(list[0].createdAt)} — ${fmtDate(list[list.length-1].createdAt)}` : "";
}
function exportJSON(){
  const list = R();
  if(!list.length){ toast("还没有记录可以导出"); return; }
  const data = {
    app: "quiet-timeline-diary",
    version: 2,
    exportedAt: new Date().toISOString(),
    records: list.map(r=>({id:r.id, title:r.title||"", content:r.content||"", createdAt:r.createdAt, date:r.createdAt})),
  };
  downloadFile(`我的记录-备份-${fmtDate(Date.now())}.json`, JSON.stringify(data, null, 2), "application/json");
  toast("已导出 JSON 备份");
}
function exportMD(){
  const list = R();
  if(!list.length){ toast("还没有记录可以导出"); return; }
  const parts = [
    "# 我的记录\n",
    `> 共 ${list.length} 篇 · 导出于 ${fmtCNDate(Date.now())} ${fmtTime(Date.now())}\n`,
  ];
  list.forEach(r=>{
    parts.push(`---\n\n## ${fmtCNDate(r.createdAt)} ${fmtWeek(r.createdAt)} · ${fmtTime(r.createdAt)}`);
    parts.push(r.title ? `\n### ${r.title||"未命名记录"}\n` : "\n");
    parts.push(`${r.content||""}\n`);
  });
  downloadFile(`我的记录-${fmtDate(Date.now())}.md`, parts.join(""), "text/markdown");
  toast("已导出 Markdown");
}
function normalizeImported(raw){
  const list = Array.isArray(raw) ? raw : (raw && Array.isArray(raw.records) ? raw.records : null);
  if(!list) return null;
  return list.map(r=>normalizeRecord(r)).filter(Boolean);
}
function handleImport(raw){
  const backup = normalizeImported(raw);
  if(!backup || !backup.length){ toast("这个文件里没有可用的记录"); return; }
  const local = R();
  const keyOf = r => `${r.createdAt}|${r.title}|${r.content}`;
  const localKeys = new Set(local.map(keyOf));
  const localIds = new Set(local.map(r=>r.id));
  const same = backup.filter(r=>localKeys.has(keyOf(r))).length;
  const fresh = backup.length - same;
  showModal({
    title: "导入备份",
    body: `备份中共 ${backup.length} 篇记录，\n其中 ${same} 篇与当前记录相同，${fresh} 篇是新的。\n\n合并导入：把新记录加入现有记录；\n覆盖当前数据：清空现有 ${local.length} 篇，换成备份内容。`,
    buttons: [
      {text:"合并导入（推荐）", cls:"mbtn-main", onClick: async ()=>{
        let added = 0;
        for(const r of backup){
          if(localKeys.has(keyOf(r))) continue;
          const rec = {...r};
          if(localIds.has(rec.id)) rec.id = newId();
          state.records.push(rec);
          idbPut(rec);
          localIds.add(rec.id);
          added++;
        }
        state.records = sortRecs(state.records);
        writeMirror(state.records);
        renderHome();
        renderSidebar();
        toast(added ? `已合并导入 ${added} 篇记录` : "备份中的记录都已存在");
      }},
      {text:"覆盖当前数据", cls:"mbtn-danger", onClick: ()=>{
        showModal({
          title: "确定覆盖？",
          body: `覆盖会删除当前的 ${local.length} 篇记录，\n替换为备份中的 ${backup.length} 篇。`,
          buttons: [
            {text:"再想想", cls:"mbtn-ghost"},
            {text:"确定覆盖", cls:"mbtn-danger", onClick: async ()=>{
              await idbClear();
              state.records = sortRecs(backup);
              state.records.forEach(idbPut);
              writeMirror(state.records);
              renderHome();
              renderSidebar();
              toast(`已恢复 ${state.records.length} 篇记录`);
            }},
          ],
        });
      }},
      {text:"取消", cls:"mbtn-ghost"},
    ],
  });
}
$("#import-file").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{ handleImport(JSON.parse(reader.result)); }
    catch(err){ toast("无法读取这个备份文件"); }
  };
  reader.onerror = ()=> toast("无法读取这个备份文件");
  reader.readAsText(f, "utf-8");
  e.target.value = "";
});

/* =========================================================
   模态框 / Toast
========================================================= */
let toastTimer = null;
function toast(msg){
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2000);
}
function showModal(opt){
  $("#modal-title").textContent = opt.title || "";
  $("#modal-body").textContent = opt.body || "";
  const acts = $("#modal-acts");
  acts.innerHTML = "";
  (opt.buttons || []).forEach(b=>{
    const el = document.createElement("button");
    el.className = "mbtn " + (b.cls || "mbtn-ghost");
    el.textContent = b.text;
    el.addEventListener("click", ()=>{
      closeModal();
      if(b.onClick) b.onClick();
    });
    acts.appendChild(el);
  });
  $("#modal-mask").classList.add("open");
}
function closeModal(){ $("#modal-mask").classList.remove("open"); }
$("#modal-mask").addEventListener("click", e=>{ if(e.target === e.currentTarget) closeModal(); });

/* =========================================================
   事件绑定
========================================================= */
$("#btn-new").addEventListener("click", ()=> openEditor(null));
$("#btn-new-empty").addEventListener("click", ()=> openEditor(null));
$("#home-title").addEventListener("click", ()=>{ $("#home-scroll").scrollTo({top:0,behavior:"smooth"}); });
$("#btn-sidebar").addEventListener("click", openSidebar);
$("#note-list").addEventListener("click", e=>{
  const btn = e.target.closest('[data-action="rename"]');
  if(btn){ e.stopPropagation(); renameRecord(btn.dataset.id); return; }
  const item = e.target.closest(".note-item");
  if(!item) return;
  state.homeScroll = $("#home-scroll").scrollTop;
  openDetail(item.dataset.id);
});
$("#note-list").addEventListener("scroll", ()=>{
  requestAnimationFrame(updateCarouselDots);
}, {passive:true});
$("#btn-back").addEventListener("click", ()=> showHome(true));
$("#btn-detail-edit").addEventListener("click", ()=>{ if(state.detailId) openEditor(state.detailId); });
$("#btn-edit").addEventListener("click", ()=>{ if(state.detailId) openEditor(state.detailId); });
$("#btn-detail-del").addEventListener("click", ()=>{ if(state.detailId) askDelete(state.detailId); });
$("#edit-back").addEventListener("click", ()=>{
  const t = $("#edit-title").value, c = $("#edit-content").value;
  if(t.trim() || c.trim()){
    showModal({ title:"放弃这次编辑？", body:"还没有保存，离开后这次输入会消失。",
      buttons:[
        {text:"继续编辑", cls:"mbtn-ghost"},
        {text:"放弃", cls:"mbtn-danger", onClick: ()=>{ state.editingId=null; showHome(true); }},
      ]});
  }else{
    state.editingId=null; showHome(true);
  }
});
$("#edit-cancel").addEventListener("click", ()=> $("#edit-back").click());
$("#edit-save").addEventListener("click", saveEditor);
$("#btn-settings").addEventListener("click", ()=>{ renderSettings(); showView("settings","vin-r"); });
$("#settings-back").addEventListener("click", ()=> showHome(true));
$("#btn-export-json").addEventListener("click", exportJSON);
$("#btn-export-md").addEventListener("click", exportMD);
$("#btn-import").addEventListener("click", ()=> $("#import-file").click());
$("#sidebar-close").addEventListener("click", closeSidebar);
$("#sidebar-mask").addEventListener("click", closeSidebar);
$("#sidebar-list").addEventListener("click", e=>{
  const btn = e.target.closest('[data-action="rename"]');
  if(btn){ e.stopPropagation(); renameRecord(btn.dataset.id); return; }
  const item = e.target.closest(".sidebar-item");
  if(!item) return;
  closeSidebar();
  openDetail(item.dataset.id);
});

/* =========================================================
   初始化
========================================================= */
(async function init(){
  try{ idb = await openIDB(); }catch(e){ idb = null; }
  let recs = null;
  if(idb) recs = await idbAll();
  if(!recs || !recs.length){
    const mirror = readMirror();
    if(mirror && mirror.length){
      recs = mirror;
      if(idb) recs.forEach(idbPut);
    }else if(!localStorage.getItem(INIT_FLAG)){
      recs = welcomeRecords();
      if(idb) recs.forEach(idbPut);
      try{ localStorage.setItem(INIT_FLAG, "1"); }catch(e){}
    }
  }
  state.records = sortRecs(upgradeData(recs || []));
  writeMirror(state.records);
  renderHome();
  showView("home", "vin-u");
})();
</script>
